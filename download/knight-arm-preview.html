<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Рыцарь — превью руки с мечом</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% 0%, #2a2530 0%, #15131c 50%, #08060a 100%);
    color: #cbd5e1;
    font-family: 'PT Serif', Georgia, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 { font-size: 18px; text-transform: uppercase; letter-spacing: 4px; color: #dc2626; margin: 0 0 20px 0; }
  .scene {
    width: 600px;
    max-width: 90vw;
    aspect-ratio: 1 / 1;
    background-image: url('/bg/battle-bg-new.png'), linear-gradient(180deg, rgba(0,0,0,0.4), rgba(0,0,0,0.7));
    background-size: cover;
    background-position: center;
    border: 1px solid #3f3f46;
    border-radius: 12px;
    position: relative;
    overflow: hidden;
  }
  .arm-container {
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    width: 48%;
    pointer-events: none;
  }
  .arm-container svg { width: 100%; height: 100%; display: block; }
  .enemy {
    position: absolute;
    left: 10%;
    top: 50%;
    transform: translateY(-50%);
    width: 40%;
    text-align: center;
  }
  .enemy .emoji { font-size: 80px; filter: drop-shadow(0 0 12px #84cc16); }
  .enemy .name { color: #84cc16; font-size: 12px; font-family: monospace; }
  .enemy .hp {
    width: 100px;
    height: 8px;
    background: rgba(0,0,0,0.6);
    border: 1px solid #84cc16;
    border-radius: 4px;
    margin: 8px auto 0;
    overflow: hidden;
  }
  .enemy .hp-fill { width: 60%; height: 100%; background: #84cc16; }
  .legend {
    margin-top: 12px;
    color: #94a3b8;
    font-size: 12px;
    font-family: monospace;
  }
  /* Animation toggle */
  .toggle {
    margin: 12px 0;
    padding: 8px 16px;
    background: linear-gradient(90deg, #7c2d12, #dc2626);
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-family: monospace;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  .attacking .arm-container svg {
    animation: swing 0.45s ease-out infinite;
  }
  @keyframes swing {
    0% { transform: rotate(-8deg); transform-origin: 82px 32px; }
    22% { transform: rotate(-28deg); transform-origin: 82px 32px; }
    50% { transform: rotate(26deg); transform-origin: 82px 32px; }
    72% { transform: rotate(-4deg); transform-origin: 82px 32px; }
    100% { transform: rotate(-8deg); transform-origin: 82px 32px; }
  }
  /* Sword trail */
  .trail {
    position: absolute;
    left: 15%;
    top: 15%;
    width: 65%;
    height: 70%;
    pointer-events: none;
    opacity: 0;
  }
  .attacking .trail { animation: trail 0.45s ease-out infinite; }
  @keyframes trail {
    0% { opacity: 0; }
    20% { opacity: 0; }
    50% { opacity: 0.95; }
    70% { opacity: 0.7; }
    100% { opacity: 0; }
  }
</style>
</head>
<body>
  <h1>Готическая рука рыцаря с мечом</h1>
  <button class="toggle" onclick="document.body.classList.toggle('attacking')">Анимация удара</button>
  <div class="scene" id="scene">
    <div class="enemy">
      <div class="emoji">🧟</div>
      <div class="name">Чумной мертвец</div>
      <div class="hp"><div class="hp-fill"></div></div>
    </div>
    <div class="arm-container">
      <svg viewBox="0 0 100 220" preserveAspectRatio="xMaxYMid meet">
        <defs>
          <linearGradient id="bladeGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#64748b"/>
            <stop offset="45%" stop-color="#cbd5e1"/>
            <stop offset="55%" stop-color="#f1f5f9"/>
            <stop offset="100%" stop-color="#64748b"/>
          </linearGradient>
          <linearGradient id="armorGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#52525b"/>
            <stop offset="50%" stop-color="#3a3a45"/>
            <stop offset="100%" stop-color="#1c1c25"/>
          </linearGradient>
          <radialGradient id="pauldronGrad" cx="0.35" cy="0.35" r="0.7">
            <stop offset="0%" stop-color="#52525b"/>
            <stop offset="60%" stop-color="#3a3a45"/>
            <stop offset="100%" stop-color="#1c1c25"/>
          </radialGradient>
        </defs>
        <!-- Pauldron -->
        <ellipse cx="82" cy="32" rx="20" ry="18" fill="#1c1c25" stroke="#0a0a0f" stroke-width="1.6"/>
        <ellipse cx="82" cy="30" rx="17" ry="15" fill="url(#pauldronGrad)" stroke="#0a0a0f" stroke-width="1"/>
        <ellipse cx="76" cy="25" rx="6" ry="3.5" fill="#71717a" opacity="0.55"/>
        <path d="M 72 18 L 74 6 L 76 18 Z" fill="#1c1c25" stroke="#0a0a0f" stroke-width="0.7"/>
        <path d="M 82 16 L 84 4 L 86 16 Z" fill="#1c1c25" stroke="#0a0a0f" stroke-width="0.7"/>
        <path d="M 90 18 L 92 7 L 94 18 Z" fill="#1c1c25" stroke="#0a0a0f" stroke-width="0.7"/>
        <circle cx="72" cy="34" r="1.4" fill="#a1a1aa"/>
        <circle cx="92" cy="34" r="1.4" fill="#a1a1aa"/>
        <circle cx="82" cy="42" r="1.4" fill="#a1a1aa"/>
        <!-- Upper arm -->
        <path d="M 78 44 Q 70 70 64 96 Q 60 102 54 100 Q 60 72 72 46 Z" fill="url(#armorGrad)" stroke="#0a0a0f" stroke-width="1.4"/>
        <path d="M 71 58 Q 68 60 67 62" stroke="#0a0a0f" stroke-width="0.6" fill="none"/>
        <path d="M 68 72 Q 65 74 64 76" stroke="#0a0a0f" stroke-width="0.6" fill="none"/>
        <path d="M 65 86 Q 62 88 61 90" stroke="#0a0a0f" stroke-width="0.6" fill="none"/>
        <path d="M 73 50 Q 70 65 66 88" stroke="#52525b" stroke-width="0.8" fill="none" opacity="0.6"/>
        <!-- Elbow -->
        <ellipse cx="56" cy="100" rx="10" ry="8" fill="#1c1c25" stroke="#0a0a0f" stroke-width="1.5"/>
        <ellipse cx="54" cy="98" rx="7" ry="5.5" fill="url(#armorGrad)" stroke="#0a0a0f" stroke-width="0.9"/>
        <path d="M 47 100 L 40 95 L 47 105 Z" fill="#1c1c25" stroke="#0a0a0f" stroke-width="0.7"/>
        <ellipse cx="51" cy="96" rx="3" ry="1.5" fill="#71717a" opacity="0.6"/>
        <!-- Forearm -->
        <path d="M 52 108 Q 45 130 42 152 Q 47 158 53 154 Q 58 130 60 110 Z" fill="url(#armorGrad)" stroke="#0a0a0f" stroke-width="1.4"/>
        <line x1="46" y1="120" x2="55" y2="118" stroke="#0a0a0f" stroke-width="0.7"/>
        <line x1="44" y1="132" x2="54" y2="130" stroke="#0a0a0f" stroke-width="0.7"/>
        <line x1="42" y1="144" x2="53" y2="142" stroke="#0a0a0f" stroke-width="0.7"/>
        <path d="M 56 112 Q 53 130 50 150" stroke="#52525b" stroke-width="0.7" fill="none" opacity="0.6"/>
        <!-- Gauntlet -->
        <rect x="38" y="152" width="16" height="7" rx="2.5" fill="#1c1c25" stroke="#0a0a0f" stroke-width="1.2"/>
        <path d="M 36 158 Q 36 172 44 176 Q 52 176 56 168 L 56 158 Z" fill="url(#armorGrad)" stroke="#0a0a0f" stroke-width="1.4"/>
        <line x1="40" y1="162" x2="40" y2="172" stroke="#0a0a0f" stroke-width="0.55"/>
        <line x1="44" y1="163" x2="44" y2="174" stroke="#0a0a0f" stroke-width="0.55"/>
        <line x1="48" y1="163" x2="48" y2="174" stroke="#0a0a0f" stroke-width="0.55"/>
        <line x1="52" y1="162" x2="52" y2="170" stroke="#0a0a0f" stroke-width="0.55"/>
        <ellipse cx="58" cy="162" rx="3.5" ry="4.5" fill="url(#armorGrad)" stroke="#0a0a0f" stroke-width="0.9"/>
        <ellipse cx="42" cy="161" rx="3" ry="2" fill="#71717a" opacity="0.55"/>
        <circle cx="46" cy="155.5" r="1" fill="#a1a1aa"/>
        <!-- Sword -->
        <g>
          <circle cx="46" cy="178" r="4" fill="#713f12" stroke="#0a0a0f" stroke-width="0.9"/>
          <circle cx="44.5" cy="176.5" r="1.8" fill="#a16207"/>
          <circle cx="46" cy="178" r="1" fill="#fbbf24" opacity="0.85"/>
          <rect x="43.5" y="158" width="5" height="20" rx="1.2" fill="#3a2a18" stroke="#0a0a0f" stroke-width="0.9"/>
          <line x1="43.5" y1="161" x2="48.5" y2="163" stroke="#1a1208" stroke-width="0.55"/>
          <line x1="43.5" y1="165" x2="48.5" y2="167" stroke="#1a1208" stroke-width="0.55"/>
          <line x1="43.5" y1="169" x2="48.5" y2="171" stroke="#1a1208" stroke-width="0.55"/>
          <line x1="43.5" y1="173" x2="48.5" y2="175" stroke="#1a1208" stroke-width="0.55"/>
          <path d="M 28 158 Q 22 154 26 148 L 35 152 L 46 154 L 57 152 L 66 148 Q 70 154 64 158 L 46 160 Z" fill="#52525b" stroke="#0a0a0f" stroke-width="1.1"/>
          <path d="M 30 156 L 46 157 L 62 156" stroke="#a1a1aa" stroke-width="0.55" fill="none"/>
          <circle cx="46" cy="155" r="1.7" fill="#a855f7" stroke="#0a0a0f" stroke-width="0.4"/>
          <circle cx="45.5" cy="154.5" r="0.7" fill="#d8b4fe"/>
          <path d="M 42 154 L 50 24 L 54 154 Z" fill="url(#bladeGrad)" stroke="#94a3b8" stroke-width="0.9"/>
          <line x1="50" y1="32" x2="50" y2="152" stroke="#475569" stroke-width="0.9" fill="none"/>
          <line x1="50.5" y1="34" x2="50.5" y2="150" stroke="#cbd5e1" stroke-width="0.4" fill="none" opacity="0.7"/>
          <path d="M 48 145 L 49.5 28 L 50.5 28 L 51 145 Z" fill="#f8fafc" opacity="0.55"/>
          <path d="M 47 35 L 50 24 L 53 35 Z" fill="#cbd5e1" opacity="0.75"/>
          <path d="M 47 78 L 53 78 M 50 75 L 50 81" stroke="#1c1c25" stroke-width="0.5" fill="none"/>
          <circle cx="50" cy="78" r="1.2" fill="#dc2626" opacity="0.85"/>
          <path d="M 48 110 L 52 110 M 49 108 L 49 114 M 51 108 L 51 114" stroke="#1c1c25" stroke-width="0.4" fill="none" opacity="0.7"/>
          <circle cx="50" cy="22" r="1.4" fill="#dc2626" opacity="0.9"/>
          <circle cx="49.6" cy="21.5" r="0.5" fill="#fca5a5" opacity="0.7"/>
        </g>
      </svg>
    </div>
    <!-- Sword trail -->
    <svg class="trail" viewBox="0 0 100 100" preserveAspectRatio="none">
      <path d="M 88 12 Q 50 32 15 78" stroke="#dc2626" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.6" style="filter: blur(3px);"/>
      <path d="M 88 12 Q 50 32 15 78" stroke="white" stroke-width="3.5" stroke-linecap="round" fill="none" style="filter: drop-shadow(0 0 8px rgba(255,255,255,0.95));"/>
      <path d="M 88 12 Q 50 32 15 78" stroke="#fef2f2" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    </svg>
  </div>
  <div class="legend">Готический меч · латная перчатка · наплечник с шипами · аметист на гарде</div>
</body>
</html>
